apiVersion: v1
kind: Namespace
metadata:
  name: llm-scaler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: decision-gen
  namespace: llm-scaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: decision-gen
rules:
  - apiGroups: ["inference.x-k8s.io"]
    resources: ["llmslorequirements"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: decision-gen
subjects:
  - kind: ServiceAccount
    name: decision-gen
    namespace: llm-scaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: decision-gen
