# Run the test suite on every push to main and on every pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the test suite
        run: |
          set -eu
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --quiet ".[dev]"
          make test PY=.venv/bin/python
