# Run the test suite on every push to main and on every pull request.
#
# The internal GitLab pipeline (.gitlab-ci.yml) already runs these tests;
# this workflow gives the public GitHub side the same signal on PRs.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the test suite
        run: |
          set -eu
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --quiet ".[dev]"
          make test PY=.venv/bin/python
