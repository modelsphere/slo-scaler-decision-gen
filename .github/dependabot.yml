version: 2
updates:
  # Runtime and test dependencies declared in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # No docker entry: the Dockerfile's base image is a build arg
  # (FROM ${BASE_IMAGE}), which Dependabot cannot follow.
