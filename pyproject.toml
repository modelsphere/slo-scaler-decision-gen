[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-gen"
version = "0.7.0"
description = "Turns SLO requirements and live signals into replica decisions for LLM inference services"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["kubernetes", "operator", "autoscaling", "llm", "slo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Clustering",
]
dependencies = [
    "kubernetes>=28",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
decision-gen = "decision_gen.__main__:main"

[project.urls]
Homepage = "https://github.com/modelsphere/slo-scaler-decision-gen"
Source = "https://github.com/modelsphere/slo-scaler-decision-gen"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["decision_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
