[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-gen"
version = "0.1.0"
description = "LLM inference scale-decision operator"
requires-python = ">=3.10"
dependencies = [
    "kubernetes>=28",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
decision-gen = "decision_gen.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["decision_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
